name: iad probe (one-off)
on:
  push:
    branches: [claude/hopeful-fermi-re2vn1]
    paths: [.github/workflows/iad-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sS -m 30 -A "$UA" -o robots.txt -w "robots %{http_code}\n" https://www.iadfrance.fr/robots.txt || true
          curl -sS -m 30 -A "$UA" -o p1.html -w "p1 %{http_code}\n" "https://www.iadfrance.fr/trouver-un-conseiller/pg-lyon_69" || true
          sleep 2
          curl -sS -m 30 -A "$UA" -o p2.html -w "p2 %{http_code}\n" "https://www.iadfrance.fr/trouver-un-conseiller/pg-lyon_69?page=2" || true
          ls -la
          git init -q && git checkout -q -b iad-probe && git add . && git -c user.name=gh -c user.email=a@b commit -qm probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" iad-probe
