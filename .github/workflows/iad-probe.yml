name: iad directory (one-off)
on:
  push:
    branches: [claude/hopeful-fermi-re2vn1]
    paths: [.github/workflows/iad-probe.yml]
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          mkdir out
          python -u scripts/campaign/iad_directory.py --town pg-lyon_69 --ville Lyon --cp 69000 --out out/iad_lyon.csv
          cd out && git init -q && git checkout -q -b iad-probe && git add . && git -c user.name=gh -c user.email=a@b commit -qm "iad Lyon"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" iad-probe
