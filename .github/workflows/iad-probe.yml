name: iad directory (one-off)
on:
  push:
    branches: [claude/hopeful-fermi-re2vn1]
    paths: [.github/workflows/iad-probe.yml]
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          mkdir out
          python -u scripts/campaign/iad_directory.py --town seine-et-marne-77 --ville "Seine-et-Marne" --max-pages 75 --out out/iad_77.csv 2>&1 | tee out/log.txt
          cd out && git init -q && git checkout -q -b iad-probe && git add . && git -c user.name=gh -c user.email=a@b commit -qm "iad 77"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" iad-probe
