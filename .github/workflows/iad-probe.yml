name: iad test delivery (one-off)
on:
  push:
    branches: [claude/hopeful-fermi-re2vn1]
    paths: [.github/workflows/iad-probe.yml]
permissions:
  contents: write
jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          sleep 90
          mkdir out
          for e in albin.quicampoix camille.pesnel charles.abbas-abadi laurie-ann.vieilly; do
            curl -sS -H "api-key: $KEY" -H "accept: application/json" \
              "https://api.brevo.com/v3/smtp/statistics/events?email=$e@iadfrance.fr&days=1&limit=50" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print('$e', [(x.get('event'), x.get('reason','')) for x in d.get('events',[])])" >> out/events.txt
          done
          cat out/events.txt
          cd out && git init -q && git checkout -q -b iad-probe && git add . && git -c user.name=gh -c user.email=a@b commit -qm events
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" iad-probe
