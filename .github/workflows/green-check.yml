name: Valeur verte sur biens réels (temporaire)
on:
  push:
    branches: [claude/hopeful-fermi-re2vn1]
    paths: [".github/workflows/green-check.yml", "scripts/audit/green_check.py"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/audit/green_check.py --per-town 4 | tee -a "$GITHUB_STEP_SUMMARY"
