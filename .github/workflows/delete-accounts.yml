name: Delete accounts (one-off)

# One-off: deletes the listed accounts (and, by cascade, their data) through
# the Supabase admin API, as asked by the owner on 2026-10-27. Removed after use.
on:
  push:
    paths:
      - ".github/workflows/delete-accounts.yml"

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete
        env:
          SB: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAILS: "tarik@lakel.fr test@sprea.invalid victor@sprea.invalid farid@sprea.invalid logimalin@gmail.com"
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          sb, key = os.environ["SB"].rstrip("/"), os.environ["KEY"]
          h = {"apikey": key, "Authorization": f"Bearer {key}"}
          def call(method, path):
              req = urllib.request.Request(sb + path, method=method, headers=h)
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read()
                  return json.loads(raw) if raw else {}
          users = call("GET", "/auth/v1/admin/users?per_page=1000").get("users", [])
          wanted = set(os.environ["EMAILS"].split())
          for u in users:
              if (u.get("email") or "").lower() in wanted:
                  call("DELETE", f"/auth/v1/admin/users/{u['id']}")
                  print("supprimé :", u["email"])
          left = [u.get("email") for u in call("GET", "/auth/v1/admin/users?per_page=1000").get("users", [])]
          print("comptes restants :", left)
          PY
