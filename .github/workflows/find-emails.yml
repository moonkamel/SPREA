name: Emails vague test (temporaire)
on:
  push:
    branches: [claude/hopeful-fermi-re2vn1]
    paths: [".github/workflows/find-emails.yml", "scripts/campaign/find_emails.py"]
permissions:
  contents: read
jobs:
  emails:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 0
            sirens: "849703541 789459500 848688370 917918716 403518210 893040048 521779025 421743394 445206485 492212329"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          SIRENS: ${{ matrix.sirens }}
          DEBUG: "1"
        run: python scripts/campaign/find_emails.py --sirens $SIRENS --out emails_${{ matrix.part }}.csv
