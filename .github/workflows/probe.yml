name: Probe (lecture d'API publiques)

# Reads the public URLs listed in scripts/probe/urls.txt from a GitHub runner
# (outside the development sandbox) and pushes the answers to the probe-results
# branch. Read-only.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["scripts/probe/urls.txt", ".github/workflows/probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir out
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sS -m 30 -A "SPREA probe" "$url" | head -c 60000 > "out/$name.txt" || echo "erreur" > "out/$name.txt"
          done < scripts/probe/urls.txt
      - name: Stream Estate (secret STREAM_ESTATE_API_KEY, if set)
        env:
          KEY: ${{ secrets.STREAM_ESTATE_API_KEY }}
        run: |
          [ -z "$KEY" ] && { echo "absent" > out/se_api.txt; exit 0; }
          curl -sS -m 30 "https://api.stream.estate/documents/properties?itemsPerPage=2&includedZipcodes[]=59000&transactionType=0" \
            -H "X-API-KEY: $KEY" -H "Content-Type: application/json" | head -c 60000 > out/se_api.txt || echo erreur > out/se_api.txt
      - name: Save
        run: |
          cd out && git init -q -b probe && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Probe $(date +%F-%H%M)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe:probe-results
