name: Green value data

# Measures the price gap between DPE classes from real sales (DVF x ADEME DPE)
# and commits api/data/green_value.json. Monthly, or on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 6 * *"
  push:
    branches: [claude/hopeful-fermi-re2vn1]
    paths: ["scripts/green_value/**", ".github/workflows/green-value.yml"]

permissions:
  contents: write

concurrency:
  group: green-value-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    # Alsace-Moselle (57, 67, 68) and Mayotte are not covered by DVF
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        dep: ["59", "75", "33"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/green_value/build.py extract --dep ${{ matrix.dep }} --out matched_${{ matrix.dep }}.csv.gz
      - uses: actions/upload-artifact@v4
        with:
          name: matched-${{ matrix.dep }}
          path: matched_${{ matrix.dep }}.csv.gz
          retention-days: 7

  fit:
    needs: extract
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.3.4
      - uses: actions/download-artifact@v4
        with:
          pattern: matched-*
          path: matched
          merge-multiple: true
      - run: python scripts/green_value/build.py fit --in matched --out api/data/green_value.json
      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/data/green_value.json
          git diff --cached --quiet && exit 0
          git commit -m "Update green value coefficients (DVF x DPE)"
          git push origin HEAD:${{ github.ref_name }}
