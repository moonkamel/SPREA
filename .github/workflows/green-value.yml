name: Green value data

on:
  workflow_dispatch:
  push:
    branches: [claude/hopeful-fermi-re2vn1]
    paths: ["scripts/green_value/**", ".github/workflows/green-value.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/green_value/probe.py
