name: Probe ADEME geo queries
on:
  push:
    branches: [claude/hopeful-fermi-re2vn1]
    paths: [".github/workflows/probe-ademe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query
        run: |
          B="https://data.ademe.fr/data-fair/api/v1/datasets/meg-83tjwtg8dyz4vv7h1dqe/lines"
          SEL="numero_dpe,date_etablissement_dpe,etiquette_dpe,etiquette_ges,type_batiment,surface_habitable_logement,adresse_ban,identifiant_ban,numero_voie_ban,nom_rue_ban,code_postal_ban,nom_commune_ban,code_insee_ban,_geopoint,periode_construction,annee_construction,complement_adresse_logement,numero_etage_appartement,complement_adresse_batiment"
          echo "--- bbox Lille centre, F/G"
          curl -s -G "$B" --data-urlencode "bbox=3.050,50.630,3.070,50.640" --data-urlencode "qs=etiquette_dpe:(F OR G)" --data-urlencode "size=3" --data-urlencode "select=$SEL" | head -c 3000; echo
          echo "--- count only"
          curl -s -G "$B" --data-urlencode "bbox=3.050,50.630,3.070,50.640" --data-urlencode "qs=etiquette_dpe:(F OR G)" --data-urlencode "size=0" | head -c 300; echo
          echo "--- geo_distance"
          curl -s -G "$B" --data-urlencode "geo_distance=3.06,50.635,500" --data-urlencode "qs=etiquette_dpe:G AND type_batiment:maison" --data-urlencode "size=1" --data-urlencode "select=$SEL" | head -c 1500; echo
          echo "--- date filter"
          curl -s -G "$B" --data-urlencode "bbox=3.050,50.630,3.070,50.640" --data-urlencode "qs=etiquette_dpe:G AND date_etablissement_dpe:[2024-01-01 TO *]" --data-urlencode "size=0" | head -c 300; echo
          echo "--- sort + size 10000 timing"
          time (curl -s -G "$B" --data-urlencode "bbox=3.00,50.60,3.10,50.66" --data-urlencode "qs=etiquette_dpe:(E OR F OR G)" --data-urlencode "size=10000" --data-urlencode "select=$SEL" -o big.json); ls -l big.json; head -c 200 big.json; echo
          echo "--- cors"
          curl -s -I -H "Origin: https://sprea.vercel.app" "https://api-adresse.data.gouv.fr/search/?q=lille&limit=1" | grep -i access-control
          curl -s -o /dev/null -w "IGN tile %{http_code} %{content_type}\n" "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&TILEMATRIX=14&TILEROW=5464&TILECOL=8331"
