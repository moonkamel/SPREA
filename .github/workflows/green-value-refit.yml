name: Green value refit (one-off)
# Re-runs the fit on the matched sales of run 37776497389 and pushes the
# result to the green-value/initial branch. Temporary (monotone class effects).
on:
  push:
    branches: [claude/hopeful-fermi-re2vn1]
    paths: [".github/workflows/green-value-refit.yml"]
permissions:
  contents: write
  actions: read
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.3.4
      - uses: actions/download-artifact@v4
        with:
          pattern: matched-*
          path: matched
          merge-multiple: true
          run-id: 37776497389
          github-token: ${{ github.token }}
      - run: python scripts/green_value/build.py fit --in matched --out api/data/green_value.json --summary summary.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b green-value/initial
          cp summary.md api/data/green_value_summary.md
          git add api/data/green_value.json api/data/green_value_summary.md
          git commit -m "Green value coefficients (DVF x DPE, national run)"
          git push --force origin green-value/initial
